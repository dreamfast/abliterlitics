# H3 AUDIO battery prompts (the headline test — p-e-w's "inconceivable" claim).
# 16 scripted spoken lines; each embeds 1-3 target words from three difficulty
# tiers. Key rare words repeat within a line to raise per-word sample count.
# "script" = the exact intended spoken words (ground truth for ASR scoring).
# "targets" = words scored for fidelity (correct / mispronounced / dropped).
# Tiers: rare_polysyllabic (the p-e-w black-cat tier), common_polysyllabic,
# monosyllabic (control — should be inside noise for ANY encoder damage).
prompts:
  - text: |
      integrated_multimodal_description: Live-action, cinematic, 35mm anamorphic. A single medium shot in a dim university lecture hall: a middle-aged male professor (S1), warm gravelly timbre, adjusts his glasses at the chalkboard, looks into camera and says: <d>[English] It is utterly inconceivable, colleagues, truly inconceivable, that the committee rejected our proposal again.</d> His shoulders drop; he taps the chalk twice.
      overall_soundscape: A low ventilation hum; a distant chair creak; the double tap of chalk on slate; his breath between words.
      non_diegetic_music: N/A
    category: speech
    label: prof_inconceivable
    script: "It is utterly inconceivable, colleagues, truly inconceivable, that the committee rejected our proposal again."
    targets: [inconceivable]
  - text: |
      integrated_multimodal_description: Live-action, cinematic, handheld documentary. A young founder (S1), bright energetic voice, stands in a sunlit co-working space, gesturing at a whiteboard, and says: <d>[English] Our entrepreneurial vision is what makes this startup special, a truly entrepreneurial leap of faith.</d> She smiles and caps her marker.
      overall_soundscape: Ambient café murmur; marker squeak on the whiteboard; a laptop keyboard nearby.
      non_diegetic_music: N/A
    category: speech
    label: founder_entrepreneurial
    script: "Our entrepreneurial vision is what makes this startup special, a truly entrepreneurial leap of faith."
    targets: [entrepreneurial]
