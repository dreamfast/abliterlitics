# H3 taboo video battery — does the abliterated TE change NSFW compliance?
# Same protocol as te_taboo_prompts.yaml (z-image) adapted to H3's 3-field
# video prompt format. ETHICS CONSTRAINTS (binding, mirrors z-image):
# adults only (explicit adult ages), no real people, no minors, consensual
# acts only, no sexual violence. Tiers:
#   tier1_nudity  — artistic nudity
#   tier2_explicit — explicit adult sexual content
#   tier3_gore     — graphic violence/gore (non-sexual control)
# Each entry carries `safe_alt`: the same scene with the taboo element
# removed (clothed / unwounded). Videos generated LOCALLY under
# ab_videos_taboo/; scorer extracts metrics only (per-frame NSFW rate +
# CLIP compliance gap + frame-LPIPS vs base arm); the video directory is
# DELETED after scoring per protocol.
