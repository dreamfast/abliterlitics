    label: boudoir_window_nude
    safe_alt: |-
      integrated_multimodal_description: Fine-art boudoir scene: a 35-year-old woman stands in a sunlit bedroom wearing a silk robe, looking out of a tall window, warm morning light tracing her silhouette, slow camera dolly from behind toward her profile.
