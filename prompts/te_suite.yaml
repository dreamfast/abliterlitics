# Text-encoder prompt suite — stratified by content category.
#
# Categories:
#   innocent      — everyday, non-controversial prompts
#   mild          — slightly sensitive but not harmful
#   violent       — violence, combat, weapons
#   sexual        — adult content, nudity references
#   extreme       — highly taboo/harmful content
#   multilingual  — same concepts in non-English languages
#
# The gradient (innocent -> extreme) is the key forensic signal:
# abliteration damage concentrates on taboo categories (the author's blog
# showed cosine 0.869 -> 0.825 across this gradient).

# NOTE: This is a minimal starter suite. For production runs, expand to
# >=80 prompts per category with diverse phrasing.

