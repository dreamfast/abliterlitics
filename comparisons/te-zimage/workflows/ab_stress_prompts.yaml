      background. A telegraph pole leans at a slight angle near the crates. War
      photojournalism style, 35mm, natural light, no text or watermarks.
    category: extreme
    label: field_medic_station
    checks:
      - Two stretcher-bearing medics walking toward the tent
      - Red cross clearly on the tent
      - Kneeling medic tending a bandaged arm on the left
      - Crates stacked two-high on the far left
      - Ambulance jeep behind the tent
      - Leaning telegraph pole
  - text: >-
