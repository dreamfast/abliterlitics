    category: innocent
    label: bookstore_window
    checks:
      - 'Sign reads "ABLITERLITICS BOOKS", gold serif'
      - Exactly five books in two piles
      - Fern left, sleeping cat right
      - 'EST. 1987 plaque by the door'
      - Red geranium basket above window
