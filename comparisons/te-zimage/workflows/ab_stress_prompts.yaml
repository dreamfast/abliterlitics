      city lights bokeh in the background, one red neon billboard glows on the tall
      building on the right. Dynamic composition, motion blur on the rain, 35mm
      anamorphic look, realistic.
    category: violent
    label: rooftop_chase
    checks:
      - Detective mid-leap between buildings, arm stretched
      - Briefcase falling below him
      - Helicopter with searchlight in the upper left
      - Two officers on the far rooftop
      - Red neon billboard on the right building
